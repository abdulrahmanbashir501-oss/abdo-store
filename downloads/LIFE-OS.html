<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f17">
<title>LIFE OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<script src="../js/abdox-config.js"></script>
<script src="../js/abdox-cloud.js"></script>
<style>
:root{--bg:#0d0f17;--bg2:#141826;--card:#1a1f31;--card2:#222840;--line:#2b3252;--tx:#eceff8;--mu:#8f98b8;--ac:#7c8cff;--ac2:#4fd1c5;--ok:#46d19a;--warn:#f5b84b;--bad:#ef6a7a;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;height:100%}
nav{width:220px;background:var(--bg2);border-inline-end:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.logo{font-weight:800;font-size:22px;letter-spacing:2px;padding:6px 12px 14px;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{background:none;border:0;text-align:start;padding:11px 14px;border-radius:12px;color:var(--mu);cursor:pointer;display:flex;gap:10px;align-items:center;transition:.2s}
nav button:hover{background:var(--card)}
nav button.on{background:var(--card2);color:var(--tx);box-shadow:inset 3px 0 0 var(--ac)}
[dir=rtl] nav button.on{box-shadow:inset -3px 0 0 var(--ac)}
main{flex:1;min-width:0;overflow:auto;padding:20px 22px 90px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:24px;flex:1}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--mu)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.card{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;animation:in .3s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{background:var(--ac);border:0;color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card2);color:var(--tx);border:1px solid var(--line)}
.btn.bad{background:var(--bad)}.btn.sm{padding:4px 9px;font-size:13px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row .grow,.grow{flex:1;min-width:0}
.done .t{text-decoration:line-through;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.big{font-size:34px;font-weight:800}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:transparent}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal>div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;animation:in .2s}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--mu);white-space:nowrap}
.p1{color:var(--bad)}.p2{color:var(--warn)}.p3{color:var(--ok)}
.week{display:grid;width:100%;grid-template-columns:repeat(7,minmax(110px,1fr));gap:8px;overflow:auto}
.day{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:120px}
.day.today{border-color:var(--ac)}
.day b{font-size:13px}.ev{font-size:12px;background:var(--card2);border-radius:7px;padding:3px 6px;margin-top:4px;border-inline-start:3px solid var(--ac)}
.ev.a{border-color:var(--warn)}.ev.s{border-color:var(--ac2)}.ev.e{border-color:var(--bad)}
.timer{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:8px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px}
.msg{padding:10px 13px;border-radius:14px;max-width:88%;white-space:pre-wrap;line-height:1.6}
.msg.u{background:var(--ac);align-self:flex-end}
.msg.b{background:var(--card2);align-self:flex-start}
.hab{display:flex;gap:4px;flex-wrap:wrap}
.hab span{width:26px;height:26px;border-radius:7px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--mu);cursor:pointer;border:1px solid var(--line)}
.hab span.on{background:var(--ok);color:#06251a;border-color:var(--ok)}
.hab span.td{outline:2px solid var(--ac)}
.empty{color:var(--mu);text-align:center;padding:18px}
.toast{position:fixed;bottom:80px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--card2);border:1px solid var(--ac);padding:10px 16px;border-radius:12px;z-index:99;animation:in .3s}
@media(max-width:760px){
 #app{flex-direction:column-reverse}
 nav{width:100%;flex-direction:row;padding:4px;border:0;border-top:1px solid var(--line);justify-content:space-around;gap:0;overflow:hidden}
 nav .logo{display:none}
 nav button{flex-direction:column;gap:2px;padding:6px 2px;font-size:10px;flex:1;align-items:center;text-align:center;min-width:0}
 nav button.on{box-shadow:none;background:var(--card2)}
 nav button span.ic{font-size:19px}
 main{padding:14px 12px 20px}
 .week{grid-template-columns:repeat(7,130px)}
 .top h1{font-size:20px}
 .timer{font-size:46px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const IC={dash:"🏠",tasks:"✅",study:"📚",projects:"💻",self:"🌱",ai:"🤖",stats:"📊",settings:"⚙️"};
/* ============ storage (IndexedDB, localStorage fallback) ============ */
const DEF=()=>({v:1,settings:{lang:"ar",sleepTarget:8,aiKey:"",aiUrl:"https://api.openai.com/v1/chat/completions",aiModel:"gpt-4o-mini",lastExport:null,dailyMin:120,planDays:7},updatedAt:0,
tasks:[],subjects:[],lessons:[],assigns:[],sessions:[],plan:[],projects:[],habits:[],sleep:[],goals:[],xp:0,log:[],chat:[]});
let S=DEF();
const DBN="lifeos",STO="kv";
function idb(){return new Promise((res,rej)=>{if(!window.indexedDB)return rej();const r=indexedDB.open(DBN,1);r.onupgradeneeded=()=>r.result.createObjectStore(STO);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){
 try{const db=await idb();const v=await new Promise((res,rej)=>{const q=db.transaction(STO).objectStore(STO).get("state");q.onsuccess=()=>res(q.result);q.onerror=rej});if(v)S=merge(DEF(),v);else{const l=localStorage.getItem("lifeos");if(l)S=merge(DEF(),JSON.parse(l))}}
 catch(e){try{const l=localStorage.getItem("lifeos");if(l)S=merge(DEF(),JSON.parse(l))}catch(_){}}
}
function merge(d,v){const o=Object.assign({},d,v);o.settings=Object.assign({},d.settings,v.settings||{});return o}
let saveT=null;
function save(){S.updatedAt=Math.max(Date.now(),(S.updatedAt||0)+1);clearTimeout(saveT);saveT=setTimeout(flush,150);cloudSchedule()}
async function flush(){
 const snap=JSON.parse(JSON.stringify(S));
 try{const db=await idb();await new Promise((res,rej)=>{const tx=db.transaction(STO,"readwrite");tx.objectStore(STO).put(snap,"state");tx.oncomplete=res;tx.onerror=rej})}
 catch(e){try{localStorage.setItem("lifeos",JSON.stringify(snap))}catch(_){}}
}
addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",()=>{if(document.hidden)flush()});
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const t=k=>(T[S.settings.lang]||T.ar)[k]||k;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const weekStart=s=>{const d=parse(s);const k=(d.getDay()+1)%7;d.setDate(d.getDate()-k);return ymd(d)};
const fmtD=s=>parse(s).toLocaleDateString(S.settings.lang==="ar"?"ar-EG":"en-GB",{weekday:"short",day:"numeric",month:"short"});
const num=n=>S.settings.lang==="ar"?Number(n).toLocaleString("ar-EG",{useGrouping:false}):String(n);
const prioL=p=>({1:t("high"),2:t("mid"),3:t("low")}[p]);
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function lvl(xp){return Math.floor(Math.sqrt(xp/50))+1}
function lvlBase(l){return (l-1)*(l-1)*50}
function addXP(n){
 const before=lvl(S.xp);S.xp=Math.max(0,S.xp+n);const after=lvl(S.xp);
 if(n>0&&after>before){S.log.unshift({id:uid(),date:today(),text:(S.settings.lang==="ar"?"وصلت للمستوى ":"Reached level ")+after});toast("🎉 "+t("levelUp")+" "+after)}
}
function logAch(text){S.log.unshift({id:uid(),date:today(),text});S.log=S.log.slice(0,300)}
function minutesOn(date,kind){return S.sessions.filter(x=>x.date===date&&(!kind||x.kind===kind)).reduce((a,b)=>a+b.min,0)}
function pct(a,b){return b?Math.round(a/b*100):0}
/* ============ modal form ============ */
function form(title,fields,init,onOk){
 const m=document.createElement("div");m.className="modal";
 const body=fields.map(f=>{const v=(init&&init[f.k]!=null)?init[f.k]:(f.d!=null?f.d:"");let i;
  if(f.type==="select")i=`<select name="${f.k}">${f.opts.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(v)?"selected":""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if(f.type==="area")i=`<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
  else i=`<input name="${f.k}" type="${f.type||"text"}" value="${esc(v)}" ${f.req?"required":""} ${f.min!=null?`min="${f.min}"`:""} ${f.max!=null?`max="${f.max}"`:""} step="any">`;
  return `<label>${esc(f.l)}</label>${i}`}).join("");
 m.innerHTML=`<div><h3>${esc(title)}</h3><form>${body}<div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="flex:1">${t("save")}</button><button type="button" class="btn sec" data-x>${t("cancel")}</button></div></form></div>`;
 document.body.appendChild(m);
 const fm=m.querySelector("form");const close=()=>m.remove();
 m.querySelector("[data-x]").onclick=close;m.onclick=e=>{if(e.target===m)close()};
 const first=fm.querySelector("input,textarea");if(first&&innerWidth>760)first.focus();
 fm.onsubmit=e=>{e.preventDefault();const o={};fields.forEach(f=>{let v=fm.elements[f.k].value.trim();if(f.type==="number")v=v===""?null:Number(v);o[f.k]=v});close();onOk(o)};
}
function ask(msg,ok){if(confirm(msg))ok()}
/* ============ nav / router ============ */
const VIEWS=["dash","tasks","study","projects","self","ai","stats","settings"];
let view="dash",calBase=today(),calMode="week",studyTab="timer",openProj=null;
function applyLang(){document.documentElement.lang=S.settings.lang;document.documentElement.dir=S.settings.lang==="ar"?"rtl":"ltr"}
function renderNav(){
 $("#nav").innerHTML=`<div class="logo">LIFE OS</div>`+VIEWS.map(v=>`<button data-v="${v}" class="${v===view?"on":""}"><span class="ic">${IC[v]}</span><span>${t(v)}</span></button>`).join("");
 $("#nav").onclick=e=>{const b=e.target.closest("button");if(b){view=b.dataset.v;openProj=null;render()}};
}
function render(){applyLang();renderNav();const m=$("#main");m.innerHTML=R[view]();bind(m);m.scrollTop=0;updateTimerUI()}
function rerender(){const m=$("#main");const st=m.scrollTop;m.innerHTML=R[view]();bind(m);m.scrollTop=st;updateTimerUI();save()}
function bind(root){
 root.onclick=e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;if(A[a])A[a](el.dataset.id,el.dataset.x,el)};
 root.onchange=e=>{const el=e.target.closest("[data-c]");if(el&&A[el.dataset.c])A[el.dataset.c](el.dataset.id,el.value,el)};
 root.querySelectorAll("form[data-f]").forEach(f=>f.onsubmit=e=>{e.preventDefault();A[f.dataset.f](f)});
}

A.genPlan=f=>{
 if(!S.subjects.length)return toast(t("noPlan"));
 const daily=Math.max(15,+f.m.value||120),nd=Math.min(30,Math.max(1,+f.d.value||7));
 S.settings.dailyMin=daily;S.settings.planDays=nd;
 S.plan=S.plan.filter(p=>p.done||p.date<today());
 for(let i=0;i<nd;i++){
  const d=addDays(today(),i);
  if(S.plan.some(p=>p.date===d))continue;
  const sc=S.subjects.map(s=>{const left=s.exam?diffDays(d,s.exam):null;if(left!==null&&left<0)return{s,w:0};
   const urg=left===null?1:(left<=3?4:left<=7?3:left<=14?2:1.2);
   const pend=S.lessons.filter(l=>l.subjectId===s.id&&!l.done).length;
   return{s,w:s.weight*urg*(1+Math.min(pend,6)/6)}}).filter(x=>x.w>0);
  const tot=sc.reduce((a,b)=>a+b.w,0);if(!tot)continue;
  sc.forEach(x=>{const m=Math.round(daily*x.w/tot/5)*5;if(m>=10)S.plan.push({id:uid(),date:d,subjectId:x.s.id,min:m,done:false})});
 }
 toast(t("planDone"));rerender();
};

function taskScore(x){let s=(4-x.prio)*10;if(x.date){const d=diffDays(today(),x.date);s+=d<0?30:d===0?25:d===1?15:d<=3?8:0}return s}
function localAI(q){
 const ar=S.settings.lang==="ar",ql=q.toLowerCase();
 const has=(...w)=>w.some(k=>ql.includes(k));
 const open=S.tasks.filter(x=>!x.done);
 if(has("نظم","نظّم","يومي","خطة اليوم","plan my day","organize","schedule")){
  const ts=open.filter(x=>!x.date||x.date<=today()).sort((a,b)=>taskScore(b)-taskScore(a));
  const asg=S.assigns.filter(x=>!x.done&&diffDays(today(),x.due)<=2).sort((a,b)=>a.due<b.due?-1:1);
  const pl=S.plan.filter(p=>p.date===today()&&!p.done);
  const hb=S.habits.filter(h=>!h.log[today()]);
  let hr=9;const slot=m=>{const s=pad(Math.min(hr,22))+":00";hr+=Math.max(1,Math.round(m/60));return s};
  let out=ar?"خطة مقترحة لليوم:\n":"Suggested plan for today:\n";const base=out;
  asg.forEach(x=>out+=`• ${slot(60)} — 📝 ${x.title} (${ar?"موعد":"due"} ${x.due})\n`);
  ts.slice(0,5).forEach(x=>out+=`• ${x.time||slot(45)} — ${x.title}\n`);
  pl.forEach(p=>out+=`• ${slot(p.min)} — 📖 ${subjName(p.subjectId)} ${p.min} ${t("minutes")}\n`);
  if(hb.length)out+=(ar?"• قبل النوم — عادات: ":"• Before bed — habits: ")+hb.map(h=>h.name).join(ar?"، ":", ")+"\n";
  if(out===base)out+=ar?"مفيش مهام اليوم. أضف مهام أو ولّد جدول مذاكرة.":"Nothing scheduled. Add tasks or generate a study plan.";
  else out+=ar?"\nنصيحة: ابدأ بأصعب بند وأنت صافي الذهن، واعمل بومودورو 25/5 بينهم.":"\nTip: start with the hardest item while fresh and use 25/5 pomodoros between items.";
  return out;
 }
 if(has("أولوي","اولوي","priorit","important","أهم","what first")){
  const ranked=[...open].sort((a,b)=>taskScore(b)-taskScore(a)).slice(0,6);
  const asg=S.assigns.filter(x=>!x.done).sort((a,b)=>a.due<b.due?-1:1).slice(0,3);
  if(!ranked.length&&!asg.length)return ar?"مفيش مهام مفتوحة. 🎉":"No open tasks. 🎉";
  let o=ar?"ترتيب الأولويات (حسب الأهمية والموعد):\n":"Priorities (by importance and deadline):\n";
  ranked.forEach((x,i)=>o+=`${i+1}. ${x.title}${x.date?" — "+x.date:""}  [${prioL(x.prio)}]\n`);
  if(asg.length){o+=ar?"\nالواجبات الأقرب:\n":"\nNearest assignments:\n";asg.forEach(x=>o+=`• ${x.title} — ${x.due}\n`)}
  o+=ar?"\nالقاعدة: المهم والعاجل الأول، بعدين المهم غير العاجل. فوّض أو احذف الباقي.":"\nRule: urgent+important first, then important. Drop or delegate the rest.";
  return o;
 }
 if(has("مشكل","problem","stuck","عالق","صعب","issue","bug")){
  return ar?"خطوات حل المشكلة:\n1. اكتبها في جملة واحدة واضحة: إيه اللي المفروض يحصل وإيه اللي بيحصل فعلًا؟\n2. قسّمها لأجزاء صغيرة وحدد أصغر جزء مش شغال.\n3. جرّب فرضية واحدة في كل مرة وسجّل النتيجة.\n4. لو عالق أكتر من 25 دقيقة: اشرحها بصوت عالي أو اكتبها لشخص تاني، أو ابحث بنص الخطأ بالظبط.\n5. خد استراحة 5 دقايق وارجع.\n\nللمشاكل التقنية العميقة فعّل مفتاح الذكاء الاصطناعي من الإعدادات."
  :"Problem-solving steps:\n1. State it in one sentence: expected vs actual.\n2. Split it and isolate the smallest broken part.\n3. Test one hypothesis at a time and note results.\n4. Stuck for 25+ minutes: explain it aloud or search the exact error text.\n5. Take a 5-minute break, then return.\n\nFor deep technical problems add an AI key in Settings.";
 }
 if(has("إنتاج","انتاج","productiv","improve","تحسين","focus","تركيز")){
  const days=Array.from({length:7},(_,i)=>addDays(today(),-i));
  const tot=days.reduce((a,d)=>a+minutesOn(d),0)/60,act=days.filter(d=>minutesOn(d)>0).length;
  const sl=S.sleep.slice(-7);const avg=sl.length?sl.reduce((a,b)=>a+sleepHours(b),0)/sl.length:null;
  const hb=S.habits.map(h=>({n:h.name,c:days.filter(d=>h.log[d]).length}));
  const tips=[];
  if(tot<10)tips.push(ar?`ساعات التركيز آخر 7 أيام ${tot.toFixed(1)} فقط. ابدأ بهدف يومي 2 بومودورو وزوده كل أسبوع.`:`Only ${tot.toFixed(1)}h focused in 7 days. Start with 2 pomodoros daily and add one each week.`);
  else tips.push(ar?`ممتاز: ${tot.toFixed(1)} ساعة تركيز آخر 7 أيام.`:`Good: ${tot.toFixed(1)}h focused in the last 7 days.`);
  if(act<5)tips.push(ar?`اشتغلت ${act} أيام بس من 7. الاستمرار أهم من الكثافة: حتى 25 دقيقة تحافظ على السلسلة.`:`Active ${act}/7 days. Consistency beats intensity: even 25 minutes keeps the chain.`);
  if(avg!==null&&avg<S.settings.sleepTarget-1)tips.push(ar?`متوسط نومك ${avg.toFixed(1)} ساعة أقل من هدفك ${S.settings.sleepTarget}. النوم أكبر عامل في التركيز.`:`Average sleep ${avg.toFixed(1)}h is under your ${S.settings.sleepTarget}h target. Sleep drives focus.`);
  hb.filter(x=>x.c<3).forEach(x=>tips.push(ar?`عادة "${x.n}" اتعملت ${x.c}/7 فقط. اربطها بحاجة بتعملها كل يوم.`:`Habit "${x.n}" done ${x.c}/7. Attach it to something you already do daily.`));
  const od=overdue().length;if(od)tips.push(ar?`عندك ${od} مهام متأخرة. خصص أول 30 دقيقة بكرة لتصفيتها.`:`${od} overdue tasks. Spend the first 30 minutes tomorrow clearing them.`);
  tips.push(ar?"خطة: 1) حدد 3 مهام رئيسية الصبح 2) بلوكات تركيز 25/5 3) راجع اليوم قبل النوم.":"Plan: 1) pick 3 main tasks in the morning 2) 25/5 focus blocks 3) review the day before bed.");
  return (ar?"تحليل إنتاجيتك:\n":"Your productivity analysis:\n")+tips.map(x=>"• "+x).join("\n");
 }
 return ar?"أقدر أساعدك في:\n• تنظيم يومك (اكتب: نظّم يومي)\n• ترتيب الأولويات (اكتب: أولويات)\n• حل مشكلة (اكتب: مشكلة ...)\n• تحسين الإنتاجية (اكتب: تحسين الإنتاجية)\nولأسئلة عامة أكتر، فعّل مفتاح الذكاء الاصطناعي من الإعدادات."
 :"I can help with:\n• organizing your day (\"plan my day\")\n• priorities (\"priorities\")\n• problems (\"problem ...\")\n• productivity (\"productivity plan\")\nFor open questions, add an AI key in Settings.";
}
async function remoteAI(q){
 const s=S.settings;const hist=S.chat.slice(-8).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
 const sys=(s.lang==="ar"?"أنت مساعد LIFE OS لتنظيم الحياة والدراسة والعمل. رد بالعربية المصرية المختصرة والعملية. ":"You are the LIFE OS assistant for life, study and work organisation. Be concise and practical. ")+"User data: "+JSON.stringify(ctxSummary());
 const r=await fetch(s.aiUrl,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+s.aiKey},body:JSON.stringify({model:s.aiModel,messages:[{role:"system",content:sys},...hist,{role:"user",content:q}]})});
 if(!r.ok)throw new Error("HTTP "+r.status);const j=await r.json();return j.choices[0].message.content;
}
R.ai=()=>{
 const sug=[t("planDay"),t("prios"),t("solve"),t("boost")];
 return head(t("ai"))+`<div class="card"><div class="chat" id="chat">${S.chat.map(m=>`<div class="msg ${m.r}">${esc(m.t)}</div>`).join("")||`<div class="msg b">${esc(localAI(""))}</div>`}</div>
 <div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">${sug.map(x=>`<button class="btn sec sm" data-a="aiQ" data-x="${esc(x)}">${esc(x)}</button>`).join("")}</div>
 <form data-f="aiSend" style="display:flex;gap:8px"><input name="q" placeholder="${t("ask")}" autocomplete="off"><button class="btn">${t("send")}</button></form></div>`;
};
async function aiAsk(q){
 if(!q.trim())return;
 S.chat.push({r:"u",t:q});const ch=$("#chat");if(ch)ch.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(q)}</div>`);
 let ans;
 if(S.settings.aiKey){try{ans=await remoteAI(q)}catch(e){ans=(S.settings.lang==="ar"?"تعذر الاتصال بالذكاء الاصطناعي ("+e.message+"). رد محلي:\n\n":"AI request failed ("+e.message+"). Local answer:\n\n")+localAI(q)}}
 else ans=localAI(q);
 S.chat.push({r:"b",t:ans});S.chat=S.chat.slice(-40);save();
 if(view==="ai"){rerender();const c=$("#chat");if(c)c.scrollTop=c.scrollHeight}
}
A.aiSend=f=>{const q=f.q.value;f.q.value="";aiAsk(q)};

function cloudOK(){return HAS()&&ABDOX.auth.isSignedIn()}
function cloudLabel(){

 if(st.s==="busy")return "☁ "+t("gBusy");

function uiCloud(){document.querySelectorAll(".cloudpill,#cloudStatus").forEach(e=>e.textContent=cloudLabel())}
function cloudPayload(){const o=JSON.parse(JSON.stringify(S));delete o.settings.aiKey;return o}
function localEmpty(){return !(S.tasks.length||S.subjects.length||S.projects.length||S.habits.length||S.goals.length||S.assigns.length||S.xp)}
function applyRemote(remote){

 S=merge(DEF(),remote);Object.assign(S.settings,keep);S.updatedAt=remote.updatedAt||Date.now();flush();render();toast(t("pulled"));
}
function cloudInit(){

 CS=ABDOX.sync.object("lifeos",{get:cloudPayload,set:applyRemote,updatedAt:()=>S.updatedAt||0,empty:localEmpty});
 ABDOX.auth.onChange(uiCloud);ABDOX.widget&&0;
}
function cloudSchedule(){if(CS)CS.changed()}
A.cloud=()=>cloudOK()?CS.now().then(()=>toast(t("synced"))):A.cloudIn();
