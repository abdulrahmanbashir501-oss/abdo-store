</div>

<script>/* ABDO X XO (tic tac toe) engine — unbeatable minimax + easy random. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.XOX = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  var LINES = [
    [0, 1, 2], [3, 4, 5], [6, 7, 8],
    [0, 3, 6], [1, 4, 7], [2, 5, 8],
    [0, 4, 8], [2, 4, 6]
  ];

  function newBoard() { return [null, null, null, null, null, null, null, null, null]; }

  function winner(b) {
    for (var i = 0; i < LINES.length; i++) {
      var L = LINES[i];
      if (b[L[0]] && b[L[0]] === b[L[1]] && b[L[1]] === b[L[2]]) {
        return { who: b[L[0]], line: L.slice() };
      }
    }
    if (b.every(function (c) { return c !== null; })) return { who: 'draw', line: null };
    return null;
  }

  function legalCells(b) {
    var out = [];
    for (var i = 0; i < 9; i++) if (!b[i]) out.push(i);
    return out;
  }

  /* minimax: score from `me` perspective. +10 win, -10 loss, 0 draw (depth-adjusted). */
  function minimax(b, me, turn, depth) {
    var w = winner(b);
    if (w) {
      if (w.who === 'draw') return 0;
      return w.who === me ? 10 - depth : depth - 10;
    }
    var cells = legalCells(b), best, i;
    if (turn === me) {
      best = -Infinity;
      for (i = 0; i < cells.length; i++) {
        b[cells[i]] = turn;
        best = Math.max(best, minimax(b, me, turn === 'X' ? 'O' : 'X', depth + 1));
        b[cells[i]] = null;
      }
    } else {
      best = Infinity;
      for (i = 0; i < cells.length; i++) {
        b[cells[i]] = turn;
        best = Math.min(best, minimax(b, me, turn === 'X' ? 'O' : 'X', depth + 1));
        b[cells[i]] = null;
      }
    }
    return best;
  }

  /* bestMove(b, me, level, rng): level 'easy' | 'hard' */
  function bestMove(b, me, level, rng) {
    rng = rng || Math.random;
    var cells = legalCells(b);
    if (!cells.length) return -1;
    if (level === 'easy') return cells[Math.floor(rng() * cells.length)];
    var best = -Infinity, bestCells = [];
    for (var i = 0; i < cells.length; i++) {
      b[cells[i]] = me;
      var s = minimax(b, me, me === 'X' ? 'O' : 'X', 1);
      b[cells[i]] = null;
      if (s > best) { best = s; bestCells = [cells[i]]; }
      else if (s === best) bestCells.push(cells[i]);
    }
    return bestCells[Math.floor(rng() * bestCells.length)];
  }

  return { newBoard: newBoard, winner: winner, legalCells: legalCells, bestMove: bestMove, minimax: minimax, LINES: LINES };
});
</script>
<script>
(function(){
'use strict';
var grid = document.getElementById('grid');
var statusTxt = document.getElementById('statusTxt');
var cfg = { mode:'ai', level:'hard', human:'X' };
var b = XOX.newBoard(), turn = 'X', over = false, thinking = false;
var scores = { X:0, O:0, D:0 };
var cells = [];

function bindRow(id, cb){
  var row = document.getElementById(id);
  row.addEventListener('click', function(e){
    var bt = e.target.closest('button'); if(!bt) return;
    row.querySelectorAll('button').forEach(function(x){ x.classList.remove('on'); });
    bt.classList.add('on');
    cb(bt.getAttribute('data-v'));
  });
}
bindRow('modeRow', function(v){
  cfg.mode = v;
  document.getElementById('lvlWrap').classList.toggle('hidden', v!=='ai');
  document.getElementById('markWrap').classList.toggle('hidden', v!=='ai');
});
bindRow('lvlRow', function(v){ cfg.level = v; });
bindRow('markRow', function(v){ cfg.human = v; });

for (var i=0;i<9;i++){
  (function(idx){
    var c = document.createElement('div');
    c.className = 'cell';
    c.addEventListener('click', function(){ onTap(idx); });
    grid.appendChild(c); cells.push(c);
  })(i);
}

document.getElementById('startBtn').addEventListener('click', function(){
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('whoX').textContent = cfg.mode==='ai' ? (cfg.human==='X'?'أنت ❌':'الكمبيوتر ❌') : 'اللاعب ❌';
  document.getElementById('whoO').textContent = cfg.mode==='ai' ? (cfg.human==='O'?'أنت ⭕':'الكمبيوتر ⭕') : 'اللاعب ⭕';
  scores = {X:0,O:0,D:0}; paintScores();
  newRound();
});
document.getElementById('roundBtn').addEventListener('click', newRound);
document.getElementById('menuBtn').addEventListener('click', function(){
  document.getElementById('game').classList.add('hidden');
  document.getElementById('setup').classList.remove('hidden');
});

function newRound(){
  b = XOX.newBoard(); turn = 'X'; over = false; thinking = false;
  cells.forEach(function(c){ c.textContent=''; c.className='cell'; });
  say();
  maybeAI();
}

function say(msg){
  if (msg){ statusTxt.innerHTML = msg; return; }
  if (cfg.mode==='ai'){
    statusTxt.innerHTML = turn===cfg.human ? 'دورك يا بطل 💪' : 'الكمبيوتر بيفكر<span class="thinking"></span>';
  } else {
    statusTxt.textContent = 'دور ' + (turn==='X'?'❌':'⭕');
  }
}

function onTap(idx){
  if (over || thinking || b[idx]) return;
  if (cfg.mode==='ai' && turn!==cfg.human) return;
  place(idx);
}

function place(idx){
  b[idx] = turn;
  cells[idx].textContent = turn==='X'?'❌':'⭕';
  cells[idx].classList.add(turn.toLowerCase(),'full');
  var w = XOX.winner(b);
  if (w){ finish(w); return; }
  turn = turn==='X'?'O':'X';
  say();
  maybeAI();
}

function maybeAI(){
  if (over || cfg.mode!=='ai' || turn===cfg.human) return;
  thinking = true; say();
  setTimeout(function(){
    var mv = XOX.bestMove(b, turn, cfg.level);
    thinking = false;
    if (mv>=0) place(mv);
  }, 400);
}

function finish(w){
  over = true;
  if (w.who==='draw'){
    scores.D++; say('تعادل 🤝');
  } else {
    scores[w.who]++;
    w.line.forEach(function(i){ cells[i].classList.add('win'); });
    if (cfg.mode==='ai'){
      say(w.who===cfg.human ? 'كسبت! 🏆' : 'الكمبيوتر كسب 🤖' + (cfg.level==='hard'?' — قولناك صعب 😈':''));
    } else {
      say('كسب ' + (w.who==='X'?'❌':'⭕') + ' 🏆');
    }
  }
  paintScores();
}

function paintScores(){
  document.getElementById('scX').textContent = scores.X;
  document.getElementById('scO').textContent = scores.O;
  document.getElementById('scD').textContent = scores.D;
}
})();
</script>
